# Serves the web UI and proxies /api (REST and WebSockets) to the backend. When the
# api service is scaled (--scale api=3) Docker DNS returns every replica and nginx
# balances across them; Redis pub/sub keeps rooms in sync between replicas.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
