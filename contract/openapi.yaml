openapi: 3.0.3
info:
  title: quizarena API
  version: 1.0.0
  description: |
    Live multiplayer quiz. Every backend (Spring Boot, Express, ASP.NET Core)
    implements this contract on the same PostgreSQL schema and the same Redis
    keys, so instances of different backends could even serve one room.

    Commands go over REST. Live updates go over a WebSocket at
    `/api/rooms/{code}/ws?token=<JWT>`, which sends
    `{"type":"room.updated","room":<Room>}` on connect and after every change.
    Changes are fanned out through Redis pub/sub, so it works across instances.

    Errors use RFC 7807 problem details with an extra machine-readable `code`.
servers:
  - url: http://localhost:8080/api
security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Liveness and dependency check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  backend: { type: string, enum: [spring, express, dotnet] }

  /auth/register:
    post:
      summary: Create a player account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Registration" }
      responses:
        "201": { $ref: "#/components/responses/Auth" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /auth/login:
    post:
      summary: Exchange credentials for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "401": { $ref: "#/components/responses/Problem" }

  /me:
    get:
      summary: The caller
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }

  /me/matches:
    get:
      summary: Your finished matches (written by the archive worker)
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MatchResult" }

  /leaderboard:
    get:
      summary: All-time top 10 by total score (cached in Redis)
      security: []
      responses:
        "200":
          description: OK
          headers:
            X-Cache: { schema: { type: string, enum: [HIT, MISS] } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeaderboardEntry" }

  /quizzes:
    get:
      summary: All quizzes (summaries, newest first)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuizSummary" }
    post:
      summary: Create a quiz you own
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewQuiz" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quiz" }
        "400": { $ref: "#/components/responses/Problem" }

  /quizzes/{quizId}:
    parameters:
      - { in: path, name: quizId, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Full quiz with answers (owner or admin only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quiz" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      summary: Delete a quiz (owner or admin only)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /rooms:
    post:
      summary: Host a room for a quiz (rate limited per user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quizId]
              properties:
                quizId: { type: string, format: uuid }
      responses:
        "201":
          description: Room in the lobby
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /rooms/{code}:
    parameters:
      - $ref: "#/components/parameters/Code"
    get:
      summary: Current room state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "404": { $ref: "#/components/responses/Problem" }

  /rooms/{code}/join:
    parameters:
      - $ref: "#/components/parameters/Code"
    post:
      summary: Join as a player (idempotent; lobby only; not the host)
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /rooms/{code}/start:
    parameters:
      - $ref: "#/components/parameters/Code"
    post:
      summary: Open the first question (host only, needs one player)
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /rooms/{code}/next:
    parameters:
      - $ref: "#/components/parameters/Code"
    post:
      summary: Advance the game (host only)
      description: |
        `question` → `reveal` (shows the answer and scores);
        `reveal` → next `question`, or `finished` after the last one.
        Finishing queues an archive job on a Redis stream.
      responses:
        "200":
          description: Advanced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /rooms/{code}/answer:
    parameters:
      - $ref: "#/components/parameters/Code"
    post:
      summary: Answer the open question (players only, once, before the deadline)
      description: |
        Timing is measured on the server from when the question opened, so a
        client cannot claim a faster answer. A correct answer scores
        500 + 500 × (time left / time limit), rounded down; a wrong one scores 0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionIndex, optionIndex]
              properties:
                questionIndex: { type: integer, minimum: 0 }
                optionIndex: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Recorded (correctness is revealed later)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Code:
      in: path
      name: code
      required: true
      schema: { type: string, pattern: "^[A-Z2-9]{6}$" }

  responses:
    Auth:
      description: Token and user
      content:
        application/json:
          schema:
            type: object
            required: [token, user]
            properties:
              token: { type: string }
              user: { $ref: "#/components/schemas/User" }
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Registration:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        displayName: { type: string, minLength: 2, maxLength: 24 }

    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [player, admin] }

    QuestionInput:
      type: object
      required: [prompt, options, correctIndex, timeLimitSec]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 300 }
        options:
          type: array
          minItems: 2
          maxItems: 4
          items: { type: string, minLength: 1, maxLength: 100 }
        correctIndex: { type: integer, minimum: 0 }
        timeLimitSec: { type: integer, minimum: 5, maximum: 120 }

    NewQuiz:
      type: object
      required: [title, questions]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        questions:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/QuestionInput" }

    QuizSummary:
      type: object
      required: [id, title, ownerId, questionCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        ownerId: { type: string, format: uuid }
        questionCount: { type: integer }
        createdAt: { type: string, format: date-time }

    Quiz:
      type: object
      required: [id, title, ownerId, createdAt, questions]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        questions:
          type: array
          items: { $ref: "#/components/schemas/QuestionInput" }

    Room:
      type: object
      required: [code, matchId, quizId, quizTitle, hostId, state, questionIndex, questionCount, question, answeredCount, players]
      properties:
        code: { type: string, example: K7QW2M }
        matchId: { type: string, format: uuid }
        quizId: { type: string, format: uuid }
        quizTitle: { type: string }
        hostId: { type: string, format: uuid }
        state: { type: string, enum: [lobby, question, reveal, finished] }
        questionIndex: { type: integer, description: "-1 in the lobby" }
        questionCount: { type: integer }
        question:
          nullable: true
          type: object
          required: [index, prompt, options, timeLimitSec, deadline, correctIndex]
          properties:
            index: { type: integer }
            prompt: { type: string }
            options: { type: array, items: { type: string } }
            timeLimitSec: { type: integer }
            deadline: { type: string, format: date-time }
            correctIndex:
              type: integer
              nullable: true
              description: null until the question is revealed
        answeredCount: { type: integer, description: Answers received for the current question }
        players:
          type: array
          description: Sorted by score (desc), then display name
          items:
            type: object
            required: [userId, displayName, score]
            properties:
              userId: { type: string, format: uuid }
              displayName: { type: string }
              score: { type: integer }

    MatchResult:
      type: object
      required: [matchId, quizTitle, code, score, correctCount, rank, playerCount, finishedAt]
      properties:
        matchId: { type: string, format: uuid }
        quizTitle: { type: string }
        code: { type: string }
        score: { type: integer }
        correctCount: { type: integer }
        rank: { type: integer, description: "1 + number of players with a higher score" }
        playerCount: { type: integer }
        finishedAt: { type: string, format: date-time }

    LeaderboardEntry:
      type: object
      required: [userId, displayName, totalScore, matches]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        totalScore: { type: integer }
        matches: { type: integer }

    Problem:
      type: object
      required: [title, status, code]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - EMAIL_TAKEN
            - INVALID_CREDENTIALS
            - NOT_HOST
            - NOT_A_PLAYER
            - HOST_CANNOT_JOIN
            - ROOM_STARTED
            - ROOM_NOT_STARTED
            - ROOM_FINISHED
            - NO_PLAYERS
            - QUESTION_CLOSED
            - ALREADY_ANSWERED
            - RATE_LIMITED
        detail: { type: string }
